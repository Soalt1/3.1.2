<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User information-page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: normal;
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: normal;
        }
        .logout {
            float: right;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .logout:hover {
            text-decoration: underline;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: normal;
        }
        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header with logout -->
    <div>
        <h1>User information-page</h1>
        <a href="#" class="logout" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">Logout</a>
        <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;"></form>
    </div>

    <div style="clear: both;"></div>

    <hr>

    <!-- About user section -->
    <h2>About user</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Role</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.roles}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
