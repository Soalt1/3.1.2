<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Все стили остаются без изменений */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Левая панель с вкладками */
        .sidebar {
            width: 150px;
            background-color: #333;
            color: white;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 14px;
        }
        .sidebar a:hover {
            background-color: #555;
        }
        .sidebar a.active {
            background-color: #4CAF50;
        }

        /* Правая панель с контентом */
        .content {
            flex: 1;
            padding: 20px;
            background-color: white;
            margin: 20px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: normal;
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin: 15px 0 10px 0;
            font-weight: normal;
        }
        h3 {
            font-size: 18px;
            color: #333;
            margin: 15px 0 10px 0;
            font-weight: normal;
        }

        .url {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .user-info {
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .logout-link {
            float: right;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-link:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 20px 0;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: normal;
        }

        .btn-add {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-edit, .btn-delete {
            color: #0066cc;
            text-decoration: none;
            margin-right: 5px;
            cursor: pointer;
        }
        .btn-edit:hover, .btn-delete:hover {
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            width: 500px;
            max-width: 90%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            margin: 0;
        }
        .modal-close {
            cursor: pointer;
            font-size: 24px;
        }
        .modal-close:hover {
            color: #999;
        }
        .modal-body {
            margin-bottom: 20px;
        }
        .modal-footer {
            text-align: right;
        }
        .modal-footer button {
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            background-color: #f2f2f2;
        }
        .modal-footer .btn-primary {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: inline-block;
            width: 100px;
            font-weight: normal;
        }
        .form-group input {
            padding: 5px;
            border: 1px solid #ddd;
            width: 250px;
        }

        .role-list {
            margin-left: 100px;
        }
        .role-item {
            margin-bottom: 5px;
        }
        .role-item input {
            width: auto;
            margin-right: 5px;
        }

        .delete-table {
            width: 100%;
            margin-bottom: 20px;
        }
        .delete-table th, .delete-table td {
            padding: 5px;
        }

        .tabs {
            margin-top: 20px;
        }
        .tabs a {
            color: #0066cc;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .tabs a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Левая панель с вкладками Admin/User -->
    <div class="sidebar">
        <a href="#" class="active">Admin</a>
        <a href="/user">User</a>
    </div>

    <!-- Правая панель с контентом -->
    <div class="content">
        <!-- Шапка с Logout -->
        <div>
            <h1>Admin panel</h1>
            <a href="#" class="logout-link" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">Logout</a>
            <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;"></form>
        </div>

        <div style="clear: both;"></div>

        <!-- URL и информация о пользователе -->
        <div class="url">http://localhost:8080/admin</div>

        <div class="user-info" id="currentUserInfo">
            <!-- Загружается через JS -->
        </div>

        <!-- Контейнер для уведомлений -->
        <div id="alertContainer"></div>

        <!-- Users table -->
        <h2>Users table</h2>

        <!-- Кнопка New User открывает модальное окно -->
        <button class="btn-add" onclick="openAddModal()">New User</button>

        <h3>All users</h3>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="usersTableBody">
            <!-- Заполняется через JS -->
            </tbody>
        </table>

        <hr>

        <!-- Tabs -->
        <div class="tabs">
            <strong>Tabs</strong>
            <a href="#" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">- Logout</a>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ ПОЛЬЗОВАТЕЛЯ -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add new user</h3>
            <span class="modal-close" onclick="closeAddModal()">&times;</span>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>First name:</label>
                <input type="text" id="addFirstName" required>
            </div>
            <div class="form-group">
                <label>Last name:</label>
                <input type="text" id="addLastName" required>
            </div>
            <div class="form-group">
                <label>Age:</label>
                <input type="number" id="addAge" min="1" max="150" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="addEmail" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="addPassword" required>
            </div>
            <div class="form-group">
                <label>Role:</label>
                <div id="addRolesContainer">
                    <!-- Загружается через JS -->
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" onclick="closeAddModal()">Close</button>
            <button type="button" class="btn-primary" onclick="addUser()">Add</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit user</h3>
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
        </div>

        <div class="modal-body">
            <input type="hidden" id="editId">

            <div class="form-group">
                <label>First name:</label>
                <input type="text" id="editFirstName" required>
            </div>
            <div class="form-group">
                <label>Last name:</label>
                <input type="text" id="editLastName" required>
            </div>
            <div class="form-group">
                <label>Age:</label>
                <input type="number" id="editAge" min="1" max="150" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="editEmail" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="editPassword" placeholder="Leave empty to keep current">
            </div>
            <div class="form-group">
                <label>Role:</label>
                <div id="editRolesContainer">
                    <!-- Загружается через JS -->
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" onclick="closeEditModal()">Close</button>
            <button type="button" class="btn-primary" onclick="updateUser()">Edit</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ УДАЛЕНИЯ -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Delete user</h3>
            <span class="modal-close" onclick="closeDeleteModal()">&times;</span>
        </div>

        <div class="modal-body">
            <p>Are you sure you want to delete this user?</p>
            <p><strong id="delete-user-info"></strong></p>
            <input type="hidden" id="deleteId">
        </div>
        <div class="modal-footer">
            <button type="button" onclick="closeDeleteModal()">Close</button>
            <button type="button" class="btn-primary" onclick="deleteUser()">Delete</button>
        </div>
    </div>
</div>

<script>
    let allRoles = [];

    $(document).ready(function() {
        loadCurrentUser();
        loadUsers();
        loadRoles();
    });

    function loadCurrentUser() {
        fetch('/api/admin/current')
            .then(response => response.json())
            .then(user => {
                let roles = user.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
                $('#currentUserInfo').html(`<span>${user.email} with roles: ${roles}</span>`);
            });
    }

    function loadUsers() {
        fetch('/api/admin/users')
            .then(response => response.json())
            .then(users => {
                let tableBody = '';
                users.forEach(user => {
                    let roles = user.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
                    tableBody += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.firstName}</td>
                            <td>${user.lastName}</td>
                            <td>${user.age}</td>
                            <td>${user.email}</td>
                            <td>${roles}</td>
                            <td>
                                <a href="#" class="btn-edit" onclick="openEditModal(${user.id})">Edit</a>
                            </td>
                            <td>
                                <a href="#" class="btn-delete" onclick="openDeleteModal(${user.id}, '${user.firstName}', '${user.lastName}')">Delete</a>
                            </td>
                        </tr>
                    `;
                });
                $('#usersTableBody').html(tableBody);
            });
    }

    function loadRoles() {
        fetch('/api/admin/roles')
            .then(response => response.json())
            .then(roles => {
                allRoles = roles;
                renderRoleCheckboxes('add');
                renderRoleCheckboxes('edit');
            });
    }

    function renderRoleCheckboxes(formType) {
        let container = $(`#${formType}RolesContainer`);
        container.empty();

        allRoles.forEach(role => {
            let roleName = role.name.replace('ROLE_', '');
            container.append(`
                <div>
                    <input type="checkbox" class="${formType}-role-checkbox" value="${role.id}" id="${formType}Role${role.id}">
                    <label for="${formType}Role${role.id}">${roleName}</label>
                </div>
            `);
        });
    }

    function openAddModal() {
        document.getElementById('addModal').style.display = 'block';
        // Сбрасываем форму
        $('#addFirstName').val('');
        $('#addLastName').val('');
        $('#addAge').val('');
        $('#addEmail').val('');
        $('#addPassword').val('');
        $('.add-role-checkbox').prop('checked', false);
    }

    function closeAddModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    function addUser() {
        let selectedRoles = [];
        $('.add-role-checkbox:checked').each(function() {
            selectedRoles.push(parseInt($(this).val()));
        });

        let user = {
            firstName: $('#addFirstName').val(),
            lastName: $('#addLastName').val(),
            age: parseInt($('#addAge').val()),
            email: $('#addEmail').val(),
            password: $('#addPassword').val(),
            roles: selectedRoles.map(id => ({id: id}))
        };

        fetch('/api/admin/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        })
            .then(response => {
                if (response.ok) {
                    closeAddModal();
                    loadUsers();
                    showAlert('User added successfully!', 'success');
                } else {
                    response.text().then(text => showAlert('Error: ' + text, 'danger'));
                }
            });
    }

    function openEditModal(id) {
        fetch(`/api/admin/users/${id}`)
            .then(response => response.json())
            .then(user => {
                $('#editId').val(user.id);
                $('#editFirstName').val(user.firstName);
                $('#editLastName').val(user.lastName);
                $('#editAge').val(user.age);
                $('#editEmail').val(user.email);
                $('#editPassword').val('');

                $('.edit-role-checkbox').prop('checked', false);
                user.roles.forEach(role => {
                    $(`#editRole${role.id}`).prop('checked', true);
                });

                document.getElementById('editModal').style.display = 'block';
            });
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function updateUser() {
        let selectedRoles = [];
        $('.edit-role-checkbox:checked').each(function() {
            selectedRoles.push(parseInt($(this).val()));
        });

        let user = {
            id: parseInt($('#editId').val()),
            firstName: $('#editFirstName').val(),
            lastName: $('#editLastName').val(),
            age: parseInt($('#editAge').val()),
            email: $('#editEmail').val(),
            password: $('#editPassword').val() || null,
            roles: selectedRoles.map(id => ({id: id}))
        };

        fetch(`/api/admin/users/${user.id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        })
            .then(response => {
                if (response.ok) {
                    closeEditModal();
                    loadUsers();
                    showAlert('User updated successfully!', 'success');
                } else {
                    response.text().then(text => showAlert('Error: ' + text, 'danger'));
                }
            });
    }

    function openDeleteModal(id, firstName, lastName) {
        document.getElementById('deleteId').value = id;
        document.getElementById('delete-user-info').innerText =
            'ID: ' + id + ', Name: ' + firstName + ' ' + lastName;
        document.getElementById('deleteModal').style.display = 'block';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    function deleteUser() {
        let id = document.getElementById('deleteId').value;

        fetch(`/api/admin/users/${id}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    closeDeleteModal();
                    loadUsers();
                    showAlert('User deleted successfully!', 'success');
                } else {
                    response.text().then(text => showAlert('Error: ' + text, 'danger'));
                }
            });
    }

    function showAlert(message, type) {
        let alertHtml = `
            <div class="alert alert-${type}">
                ${message}
            </div>
        `;
        $('#alertContainer').html(alertHtml);

        setTimeout(() => {
            $('#alertContainer').empty();
        }, 3000);
    }

    // Закрытие модальных окон при клике вне их
    window.onclick = function(event) {
        if (event.target == document.getElementById('addModal')) {
            closeAddModal();
        }
        if (event.target == document.getElementById('editModal')) {
            closeEditModal();
        }
        if (event.target == document.getElementById('deleteModal')) {
            closeDeleteModal();
        }
    }
</script>
</body>
</html>
