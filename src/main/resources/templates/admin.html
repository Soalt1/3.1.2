<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Левая панель с вкладками */
        .sidebar {
            width: 150px;
            background-color: #333;
            color: white;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 14px;
        }
        .sidebar a:hover {
            background-color: #555;
        }
        .sidebar a.active {
            background-color: #4CAF50;
        }

        /* Правая панель с контентом */
        .content {
            flex: 1;
            padding: 20px;
            background-color: white;
            margin: 20px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: normal;
        }
        h2 {
            font-size: 20px;
            color: #333;
            margin: 15px 0 10px 0;
            font-weight: normal;
        }
        h3 {
            font-size: 18px;
            color: #333;
            margin: 15px 0 10px 0;
            font-weight: normal;
        }

        .url {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .user-info {
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .logout-link {
            float: right;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-link:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 20px 0;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: normal;
        }

        .btn-add {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-edit, .btn-delete {
            color: #0066cc;
            text-decoration: none;
            margin-right: 5px;
            cursor: pointer;
        }
        .btn-edit:hover, .btn-delete:hover {
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            width: 500px;
            max-width: 90%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            margin: 0;
        }
        .modal-close {
            cursor: pointer;
            font-size: 24px;
        }
        .modal-close:hover {
            color: #999;
        }
        .modal-body {
            margin-bottom: 20px;
        }
        .modal-footer {
            text-align: right;
        }
        .modal-footer button {
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            background-color: #f2f2f2;
        }
        .modal-footer .btn-primary {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: inline-block;
            width: 100px;
            font-weight: normal;
        }
        .form-group input {
            padding: 5px;
            border: 1px solid #ddd;
            width: 250px;
        }

        .role-list {
            margin-left: 100px;
        }
        .role-item {
            margin-bottom: 5px;
        }
        .role-item input {
            width: auto;
            margin-right: 5px;
        }

        .delete-table {
            width: 100%;
            margin-bottom: 20px;
        }
        .delete-table th, .delete-table td {
            padding: 5px;
        }

        .tabs {
            margin-top: 20px;
        }
        .tabs a {
            color: #0066cc;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .tabs a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Левая панель с вкладками Admin/User -->
    <div class="sidebar">
        <a href="#" class="active">Admin</a>
        <a href="/user">User</a>
    </div>

    <!-- Правая панель с контентом -->
    <div class="content">
        <!-- Шапка с Logout -->
        <div>
            <h1>Admin panel</h1>
            <a href="#" class="logout-link" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">Logout</a>
            <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;"></form>
        </div>

        <div style="clear: both;"></div>

        <!-- URL и информация о пользователе -->
        <div class="url">http://localhost:8080/admin</div>

        <div class="user-info" th:if="${currentUser}">
            <span th:text="${currentUser.email} + ' with roles: ' + ${currentUser.roles}"></span>
        </div>

        <!-- Users table -->
        <h2>Users table</h2>

        <!-- Кнопка New User открывает модальное окно -->
        <button class="btn-add" onclick="openAddModal()">New User</button>

        <h3>All users</h3>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.roles}"></td>
                <td>
                    <a href="#" class="btn-edit"
                       th:data-id="${user.id}"
                       th:data-firstname="${user.firstName}"
                       th:data-lastname="${user.lastName}"
                       th:data-age="${user.age}"
                       th:data-email="${user.email}"
                       th:data-roles="${user.roles}"
                       onclick="openEditModal(this)">Edit</a>
                </td>
                <td>
                    <a href="#" class="btn-delete"
                       th:data-id="${user.id}"
                       th:data-firstname="${user.firstName}"
                       th:data-lastname="${user.lastName}"
                       onclick="openDeleteModal(this)">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>

        <hr>

        <!-- Tabs -->
        <div class="tabs">
            <strong>Tabs</strong>
            <a href="#" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">- Logout</a>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ ПОЛЬЗОВАТЕЛЯ -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add new user</h3>
            <span class="modal-close" onclick="closeAddModal()">&times;</span>
        </div>

        <form th:action="@{/admin/add}" method="post">
            <div class="modal-body">
                <div class="form-group">
                    <label>First name:</label>
                    <input type="text" name="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last name:</label>
                    <input type="text" name="lastName" required>
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" name="age" min="1" max="150" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Role:</label>
                    <div th:each="role : ${roles}">
                        <input type="checkbox" name="roleIds" th:value="${role.id}">
                        <label th:text="${role}"></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeAddModal()">Close</button>
                <button type="submit" class="btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit user</h3>
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
        </div>

        <form th:action="@{/admin/update}" method="post">
            <!-- ВАЖНО: это поле будет заполнено через JavaScript -->
            <input type="hidden" name="id" id="edit-id">

            <div class="modal-body">
                <div class="form-group">
                    <label>First name:</label>
                    <input type="text" name="firstName" id="edit-firstName" required>
                </div>
                <div class="form-group">
                    <label>Last name:</label>
                    <input type="text" name="lastName" id="edit-lastName" required>
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" name="age" id="edit-age" min="1" max="150" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" id="edit-email" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" id="edit-password" placeholder="Leave empty to keep current">
                </div>
                <div class="form-group">
                    <label>Role:</label>
                    <div th:each="role : ${roles}">
                        <input type="checkbox" class="edit-role-checkbox"
                               name="roleIds" th:value="${role.id}"
                               th:id="'edit_role_' + ${role.id}">
                        <label th:for="'edit_role_' + ${role.id}" th:text="${role}"></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeEditModal()">Close</button>
                <button type="submit" class="btn-primary">Edit</button>
            </div>
        </form>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ УДАЛЕНИЯ -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Delete user</h3>
            <span class="modal-close" onclick="closeDeleteModal()">&times;</span>
        </div>

        <div class="modal-body">
            <p>Are you sure you want to delete this user?</p>
            <p><strong id="delete-user-info"></strong></p>

            <!-- Скрытая форма для отправки запроса на удаление -->
            <form id="deleteForm" th:action="@{/admin/delete}" method="post">
                <input type="hidden" name="id" id="delete-id">
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" onclick="closeDeleteModal()">Close</button>
            <button type="button" class="btn-primary" onclick="submitDelete()">Delete</button>
        </div>
    </div>
</div>

<script>
    // Модальное окно для добавления
    var addModal = document.getElementById('addModal');

    function openAddModal() {
        addModal.style.display = 'block';
    }

    function closeAddModal() {
        addModal.style.display = 'none';
    }

    // Модальное окно для редактирования
    var editModal = document.getElementById('editModal');

    function openEditModal(link) {
        var data = link.dataset;

        // Заполняем поля формы данными из data-атрибутов
        document.getElementById('edit-id').value = data.id;
        document.getElementById('edit-firstName').value = data.firstname;
        document.getElementById('edit-lastName').value = data.lastname;
        document.getElementById('edit-age').value = data.age;
        document.getElementById('edit-email').value = data.email;
        document.getElementById('edit-password').value = '';

        // Сбросить все чекбоксы
        document.querySelectorAll('#editModal .edit-role-checkbox').forEach(cb => cb.checked = false);

        // Отметить роли пользователя
        if (data.roles) {
            var userRoles = data.roles.split(', ');
            document.querySelectorAll('#editModal .edit-role-checkbox').forEach(cb => {
                if (userRoles.includes(cb.nextElementSibling.textContent.trim())) {
                    cb.checked = true;
                }
            });
        }

        editModal.style.display = 'block';
    }

    function closeEditModal() {
        editModal.style.display = 'none';
    }

    // Модальное окно для удаления
    var deleteModal = document.getElementById('deleteModal');

    function openDeleteModal(link) {
        var data = link.dataset;
        document.getElementById('delete-id').value = data.id;
        document.getElementById('delete-user-info').innerText =
            'ID: ' + data.id + ', Name: ' + data.firstname + ' ' + data.lastname;
        deleteModal.style.display = 'block';
    }

    function closeDeleteModal() {
        deleteModal.style.display = 'none';
    }

    function submitDelete() {
        document.getElementById('deleteForm').submit();
    }

    // Закрытие модальных окон при клике вне их
    window.onclick = function(event) {
        if (event.target == addModal) {
            addModal.style.display = 'none';
        }
        if (event.target == editModal) {
            editModal.style.display = 'none';
        }
        if (event.target == deleteModal) {
            deleteModal.style.display = 'none';
        }
    }
</script>
</body>
</html>
