<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <!-- Header with logout -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">Admin panel</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-lg">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>

    <!-- Users Table -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white py-3">
            <h4 class="mb-0">Users table</h4>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}" class="fw-bold"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                                    <span class="badge bg-info text-dark"
                                          th:text="${user.roles}"
                                          th:title="${user.roles}"></span>
                        </td>
                        <td>
                            <button class="btn btn-warning btn-sm px-3"
                                    onclick="showEditForm(this)"
                                    data-id="${user.id}"
                                    data-firstname="${user.firstName}"
                                    data-lastname="${user.lastName}"
                                    data-age="${user.age}"
                                    data-email="${user.email}"
                                    data-roles="${user.roles}">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/admin/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button type="submit" class="btn btn-danger btn-sm px-3"
                                        onclick="return confirm('Are you sure you want to delete this user?')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add New User Section -->
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white py-3">
            <h4 class="mb-0">New User</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/add}" method="post" class="row g-4">
                <div class="col-md-6">
                    <label for="firstName" class="form-label fw-bold">First name</label>
                    <input type="text" class="form-control form-control-lg"
                           id="firstName" name="firstName" placeholder="First name" required>
                </div>

                <div class="col-md-6">
                    <label for="lastName" class="form-label fw-bold">Last name</label>
                    <input type="text" class="form-control form-control-lg"
                           id="lastName" name="lastName" placeholder="Last name" required>
                </div>

                <div class="col-md-6">
                    <label for="age" class="form-label fw-bold">Age</label>
                    <input type="number" class="form-control form-control-lg"
                           id="age" name="age" placeholder="Age" min="1" max="150" required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control form-control-lg"
                           id="email" name="email" placeholder="Email" required>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control form-control-lg"
                           id="password" name="password" placeholder="Password" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold d-block">Role</label>
                    <div class="form-check form-check-inline" th:each="role : ${roles}">
                        <input type="checkbox" class="form-check-input"
                               name="roleIds" th:value="${role.id}"
                               th:id="'role_' + ${role.id}">
                        <label class="form-check-label fw-bold"
                               th:for="'role_' + ${role.id}"
                               th:text="${role}"></label>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success btn-lg px-5">
                        <i class="bi bi-plus-circle"></i> Add new user
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/update}" method="post">
                <div class="modal-body p-4">
                    <input type="hidden" name="id" id="edit-id">

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">ID</label>
                            <input type="text" class="form-control" id="edit-id-display" readonly>
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">First name</label>
                            <input type="text" class="form-control" name="firstName" id="edit-firstName" required>
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">Last name</label>
                            <input type="text" class="form-control" name="lastName" id="edit-lastName" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">Age</label>
                            <input type="number" class="form-control" name="age" id="edit-age" min="1" max="150" required>
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" name="email" id="edit-email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" id="edit-password"
                               placeholder="Leave empty to keep current">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold d-block">Role</label>
                        <div class="form-check form-check-inline" th:each="role : ${roles}">
                            <input type="checkbox" class="form-check-input role-checkbox"
                                   name="roleIds" th:value="${role.id}"
                                   th:id="'edit_role_' + ${role.id}">
                            <label class="form-check-label fw-bold"
                                   th:for="'edit_role_' + ${role.id}"
                                   th:text="${role}"></label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-warning fw-bold">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var editModal = new bootstrap.Modal(document.getElementById('editModal'));

    function showEditForm(button) {
        const data = button.dataset;
        document.getElementById('edit-id').value = data.id;
        document.getElementById('edit-id-display').value = data.id;
        document.getElementById('edit-firstName').value = data.firstname;
        document.getElementById('edit-lastName').value = data.lastname;
        document.getElementById('edit-age').value = data.age;
        document.getElementById('edit-email').value = data.email;
        document.getElementById('edit-password').value = '';

        // Clear all checkboxes
        document.querySelectorAll('#editModal .role-checkbox').forEach(cb => cb.checked = false);

        // Check the user's roles
        if (data.roles) {
            const userRoles = data.roles.split(', ');
            document.querySelectorAll('#editModal .role-checkbox').forEach(cb => {
                if (userRoles.includes(cb.nextElementSibling.textContent.trim())) {
                    cb.checked = true;
                }
            });
        }

        editModal.show();
    }
</script>
</body>
</html>
